<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>VISOR-GIS-PVU</title>

    <!-- MapLibre & PMTiles -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <style type="text/tailwindcss">
        :root {
            --inst-imss-ord: #D55E00;
            --inst-imss-bien: #CC78BC;
            --inst-issste: #029E73;
            --inst-ssd: #0173B2;
            --electric-blue: #2962FF;
            --bg-white: #FFFFFF;
            --surface-gray: #F8FAFC;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --border-color: #E2E8F0;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--surface-gray);
            color: var(--text-primary);
        }
        .border-inst-imss-ord { border-left-color: var(--inst-imss-ord) !important; }
        .border-inst-imss-bien { border-left-color: var(--inst-imss-bien) !important; }
        .border-inst-issste { border-left-color: var(--inst-issste) !important; }
        .border-inst-ssd { border-left-color: var(--inst-ssd) !important; }
        
        .checkbox-imss-ord { @apply text-[#D55E00] focus:ring-[#D55E00]; }
        .checkbox-imss-bien { @apply text-[#CC78BC] focus:ring-[#CC78BC]; }
        .checkbox-issste { @apply text-[#029E73] focus:ring-[#029E73]; }
        .checkbox-ssd { @apply text-[#0173B2] focus:ring-[#0173B2]; }
        
        .control-sheet {
            background: var(--bg-white);
            box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
            transition: transform 0.3s ease-in-out;
        }
        /* Mobile: Bottom Sheet logic could go here if needed */
        
        .map-overlay {
            background: linear-gradient(to bottom, rgba(255,255,255,0) 70%, rgba(255,255,255,0.8) 100%);
            pointer-events: none;
        }
        
        .sharp-input {
            border: 1px solid var(--border-color);
            background: var(--bg-white);
            border-radius: 4px;
        }
        .sharp-input:focus {
            border-color: var(--electric-blue);
            ring: 1px solid var(--electric-blue);
            outline: none;
        }
        
        /* Map Container override */
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        /* Auto-hide search results */
        .search-results {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            display: none; /* Hidden by default */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .search-results.active {
            display: block;
        }
        .search-result-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .search-result-item:hover {
            background-color: #f1f5f9;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="h-screen w-full flex flex-col overflow-hidden bg-slate-50">
    <!-- Floating Branding (Top Left) -->
    <div
        class="absolute top-4 left-4 z-10 bg-white/90 backdrop-blur shadow-sm border border-slate-200 rounded-lg p-2 flex items-center gap-2 sm:gap-3">
        <div class="bg-blue-600 text-white p-1.5 rounded flex items-center justify-center">
            <span class="material-symbols-outlined text-lg">explore</span>
        </div>
        <div class="hidden sm:block leading-tight">
            <h1 class="text-sm font-bold text-slate-800">VISOR-GIS-PVU</h1>
            <p class="text-[10px] text-slate-500 font-medium tracking-wide">CLARIDAD v2.1</p>
        </div>
    </div>

    <main class="relative h-full w-full overflow-hidden">
        <!-- Map Container -->
        <div class="absolute inset-0 z-0">
            <div id="map"></div>
            <div class="absolute inset-0 map-overlay pointer-events-none"></div>
        </div>

        <!-- Search Bar (Top Center) -->
        <div class="absolute top-4 left-1/2 -translate-x-1/2 w-[90%] max-w-md z-10 group">
            <div
                class="bg-white/90 backdrop-blur border border-slate-200 rounded-xl flex items-center px-4 py-3 shadow-sm group-focus-within:shadow-md group-focus-within:bg-white transition-all">
                <span class="material-symbols-outlined text-slate-400 mr-3">search</span>
                <input id="searchInput"
                    class="bg-transparent border-none text-slate-800 placeholder-slate-400 focus:ring-0 w-full text-sm font-medium focus:outline-none"
                    placeholder="Buscar..." type="text" />
            </div>
            <!-- Search Results Container -->
            <div id="searchResults" class="search-results"></div>
        </div>

        <!-- Locate Button -->
        <button id="locateBtn"
            class="absolute bottom-[40%] right-4 z-10 bg-white border border-slate-200 text-[#2962FF] p-3 rounded-xl shadow-lg active:scale-95 transition-transform hover:bg-slate-50">
            <span class="material-symbols-outlined text-2xl">my_location</span>
        </button>

        <!-- Loading Indicator (Hidden by default, toggled via JS) -->
        <div id="loading"
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white px-4 py-2 rounded-lg shadow-lg z-50 flex items-center gap-2 hidden">
            <div class="animate-spin h-5 w-5 border-2 border-blue-500 rounded-full border-t-transparent"></div>
            <span class="text-sm font-medium text-slate-700">Cargando...</span>
        </div>

        <!-- Info Panel / Popup Context (Hidden by default) -->
        <div id="infoPanel"
            class="hidden absolute top-20 right-4 w-72 bg-white rounded-lg shadow-xl border border-slate-200 z-10 p-4">
            <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-slate-800 text-sm upppercase">Detalles</h3>
                <button id="closeInfo" class="text-slate-400 hover:text-slate-600">
                    <span class="material-symbols-outlined text-lg">close</span>
                </button>
            </div>
            <div class="info-content text-sm text-slate-600">
                Selecciona un elemento en el mapa.
            </div>
        </div>

        <!-- Floating Action Button for Layers (Top Right) -->
        <button id="menuBtn"
            class="absolute top-4 right-4 z-10 bg-white p-3 rounded-xl shadow-md border border-slate-200 text-slate-700 hover:bg-slate-50 transition-colors active:scale-95">
            <span class="material-symbols-outlined text-2xl">layers</span>
        </button>

        <!-- Sidebar (Drawer) -->
        <aside id="sidebar"
            class="fixed top-0 right-0 z-30 h-full w-80 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col border-l border-slate-200">
            <!-- Header -->
            <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between bg-white shrink-0">
                <h2 class="text-base font-bold text-slate-800">Capas Visibles</h2>
                <button id="closeSidebar"
                    class="p-1.5 -mr-1 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-50 transition-colors">
                    <span class="material-symbols-outlined text-xl">close</span>
                </button>
            </div>

            <!-- Scrollable Content -->
            <div class="flex-1 overflow-y-auto overscroll-contain px-0 py-2" id="layerControls">

                <!-- GRUPO: Epidemiología -->
                <div class="px-4 py-2 bg-slate-50 border-b border-slate-100">
                    <h3 class="text-[10px] font-bold text-red-500 uppercase tracking-wider">Epidemiología</h3>
                </div>

                <!-- Municipio de Notificación -->
                <label
                    class="flex items-center justify-between px-4 py-2.5 border-b border-slate-50 hover:bg-slate-50 transition-colors border-l-4 border-orange-500 cursor-pointer">
                    <div class="flex items-center gap-3">
                        <!-- Icono o punto identificador -->
                        <span class="w-3 h-3 rounded-sm bg-[#FF8C00] border border-[#CC7000]"></span>
                        <div class="flex flex-col">
                            <span class="text-xs font-medium text-slate-700">Municipio de Notificación</span>
                            <span class="text-[9px] text-slate-400">Casos Confirmados</span>
                        </div>
                    </div>
                    <input type="checkbox" data-layer-id="sarampion_notificacion"
                        class="h-4 w-4 rounded border-slate-300 text-[#FF8C00] focus:ring-[#FF8C00] focus:ring-offset-0" />
                </label>

                <!-- Municipio de Residencia -->
                <label
                    class="flex items-center justify-between px-4 py-2.5 border-b border-slate-50 hover:bg-slate-50 transition-colors border-l-4 border-red-500 cursor-pointer">
                    <div class="flex items-center gap-3">
                        <span class="w-3 h-3 rounded-sm bg-[#E53E3E] border border-[#C53030]"></span>
                        <div class="flex flex-col">
                            <span class="text-xs font-medium text-slate-700">Municipio de Residencia</span>
                            <span class="text-[9px] text-slate-400">Casos Positivos 2026</span>
                        </div>
                    </div>
                    <input type="checkbox" data-layer-id="sarampion_mun_residencia"
                        class="h-4 w-4 rounded border-slate-300 text-[#E53E3E] focus:ring-[#E53E3E] focus:ring-offset-0" />
                </label>

                <!-- GRUPO: AGEBs Urbanas -->
                <div class="px-4 py-2 bg-slate-50 border-b border-slate-100">
                    <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">AGEBs Urbanas</h3>
                </div>

                <!-- IMSS Ordinario -->
                <label
                    class="flex items-center justify-between px-4 py-2.5 border-b border-slate-50 hover:bg-slate-50 transition-colors border-l-4 border-inst-imss-ord cursor-pointer">
                    <div class="flex items-center gap-3">
                        <span class="w-2 h-2 rounded-full bg-[#D55E00]"></span>
                        <span class="text-xs font-medium text-slate-700">IMSS Ordinario</span>
                    </div>
                    <input type="checkbox" data-layer-id="urbano_imss_ordinario"
                        class="h-4 w-4 rounded border-slate-300 text-[#D55E00] focus:ring-[#D55E00] focus:ring-offset-0" />
                </label>

                <!-- IMSS Bienestar -->
                <label
                    class="flex items-center justify-between px-4 py-2.5 border-b border-slate-50 hover:bg-slate-50 transition-colors border-l-4 border-inst-imss-bien cursor-pointer">
                    <div class="flex items-center gap-3">
                        <span class="w-2 h-2 rounded-full bg-[#CC78BC]"></span>
                        <span class="text-xs font-medium text-slate-700">IMSS Bienestar</span>
                    </div>
                    <input type="checkbox" data-layer-id="urbano_imss_bienestar"
                        class="h-4 w-4 rounded border-slate-300 text-[#CC78BC] focus:ring-[#CC78BC] focus:ring-offset-0" />
                </label>

                <!-- ISSSTE -->
                <label
                    class="flex items-center justify-between px-4 py-2.5 border-b border-slate-50 hover:bg-slate-50 transition-colors border-l-4 border-inst-issste cursor-pointer">
                    <div class="flex items-center gap-3">
                        <span class="w-2 h-2 rounded-full bg-[#029E73]"></span>
                        <span class="text-xs font-medium text-slate-700">ISSSTE</span>
                    </div>
                    <input type="checkbox" data-layer-id="urbano_issste"
                        class="h-4 w-4 rounded border-slate-300 text-[#029E73] focus:ring-[#029E73] focus:ring-offset-0" />
                </label>

                <!-- SSD -->
                <label
                    class="flex items-center justify-between px-4 py-2.5 border-b border-slate-100 hover:bg-slate-50 transition-colors border-l-4 border-inst-ssd cursor-pointer">
                    <div class="flex items-center gap-3">
                        <span class="w-2 h-2 rounded-full bg-[#0173B2]"></span>
                        <span class="text-xs font-medium text-slate-700">SSD</span>
                    </div>
                    <input type="checkbox" data-layer-id="urbano_ssd"
                        class="h-4 w-4 rounded border-slate-300 text-[#0173B2] focus:ring-[#0173B2] focus:ring-offset-0" />
                </label>

                <!-- GRUPO: Localidades Rurales -->
                <div class="px-4 py-2 bg-slate-50 border-b border-slate-100 mt-1">
                    <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Localidades Rurales</h3>
                </div>

                <!-- Rural IMSS Bienestar -->
                <label
                    class="flex items-center justify-between px-4 py-2.5 border-b border-slate-50 hover:bg-slate-50 transition-colors border-l-4 border-inst-imss-bien cursor-pointer">
                    <div class="flex items-center gap-3">
                        <span class="w-2 h-2 rounded-full bg-[#CC78BC]"></span>
                        <span class="text-xs font-medium text-slate-700">IMSS Bienestar</span>
                    </div>
                    <input type="checkbox" data-layer-id="rural_imss_bienestar"
                        class="h-4 w-4 rounded border-slate-300 text-[#CC78BC] focus:ring-[#CC78BC] focus:ring-offset-0" />
                </label>

                <!-- Rural ISSSTE -->
                <label
                    class="flex items-center justify-between px-4 py-2.5 border-b border-slate-50 hover:bg-slate-50 transition-colors border-l-4 border-inst-issste cursor-pointer">
                    <div class="flex items-center gap-3">
                        <span class="w-2 h-2 rounded-full bg-[#029E73]"></span>
                        <span class="text-xs font-medium text-slate-700">ISSSTE</span>
                    </div>
                    <input type="checkbox" data-layer-id="rural_issste"
                        class="h-4 w-4 rounded border-slate-300 text-[#029E73] focus:ring-[#029E73] focus:ring-offset-0" />
                </label>

                <!-- Rural SSD -->
                <label
                    class="flex items-center justify-between px-4 py-2.5 border-b border-slate-100 hover:bg-slate-50 transition-colors border-l-4 border-inst-ssd cursor-pointer">
                    <div class="flex items-center gap-3">
                        <span class="w-2 h-2 rounded-full bg-[#0173B2]"></span>
                        <span class="text-xs font-medium text-slate-700">SSD</span>
                    </div>
                    <input type="checkbox" data-layer-id="rural_ssd"
                        class="h-4 w-4 rounded border-slate-300 text-[#0173B2] focus:ring-[#0173B2] focus:ring-offset-0" />
                </label>
            </div>

            <!-- Footer Controls -->
            <div class="shrink-0 px-6 py-5 bg-slate-50 border-t border-slate-200 space-y-4">
                <!-- Opacity Slider -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-bold text-slate-800">Transparencia</span>
                        <span id="opacityValue"
                            class="text-xs font-medium text-slate-500 bg-slate-200 px-2 py-0.5 rounded">80%</span>
                    </div>
                    <input id="opacitySlider" type="range" min="10" max="100" value="80" step="5"
                        class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-[#2962FF]" />
                </div>

                <!-- Labels Toggle -->
                <div class="flex items-center justify-between">
                    <div class="flex flex-col">
                        <span class="text-sm font-bold text-slate-800">Mostrar Etiquetas</span>
                        <span class="text-[10px] text-slate-500">Nombres de unidades</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input id="globalLabelToggle" type="checkbox" class="sr-only peer" checked />
                        <div
                            class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#2962FF]">
                        </div>
                    </label>
                </div>
            </div>
        </aside>

        <!-- Sidebar Overlay (Backdrop) -->
        <div id="sidebarOverlay"
            class="fixed inset-0 bg-black/20 z-20 hidden backdrop-blur-sm transition-opacity opacity-0"></div>
    </main>
    <div class="bg-white pb-2 flex justify-center border-t border-slate-100">
        <div class="w-32 h-1 bg-slate-300 rounded-full mt-2"></div>
    </div>

    <!-- Application Logic -->
    <script src="logger.js?v=4.1.0"></script>
    <script src="config.js?v=4.1.0"></script>
    <script src="app.js?v=4.1.0"></script>
</body>

</html>
